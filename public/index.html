<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#F7F5F2"/><title>두근 — 다시 마주하고 싶은 사람</title><meta name="description" content="현실에서 스친 사람을 다시 찾고, 마음이 가까워진 순간만 알려주는 관계 앱 두근"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
:root{--bg:#F7F5F2;--panel:#fff;--text:#1F1E1C;--sub:#706B65;--line:#E7E1DA;--soft:#F0ECE7;--accent:#F36B7F;--accentSoft:#FFE9EE;--deep:#2B2926}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:90px}.screen{padding:20px 18px 118px}.brand{font-size:14px;color:var(--sub);margin-bottom:28px}.hero{padding:46px 0 30px}.hero h1{font-size:31px;line-height:1.2;letter-spacing:-.045em;margin:0 0 14px;font-weight:800}.hero p{font-size:16px;line-height:1.62;color:var(--sub);margin:0;word-break:keep-all}.btn{width:100%;border:0;border-radius:17px;padding:16px 18px;font-weight:750;font-size:15px;background:var(--deep);color:#fff;margin-top:10px}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--sub);border:0}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:12px}.event-card{padding:22px}.tag{font-size:12px;color:var(--sub);background:var(--soft);border-radius:999px;padding:6px 9px;display:inline-block}.eyebrow{font-size:12px;font-weight:700;color:#9A938B}.muted{color:var(--sub);font-size:14px;line-height:1.62}.section{margin-top:34px}.section-title{font-size:15px;font-weight:800;margin-bottom:10px}.section-desc{font-size:13px;color:var(--sub);margin-bottom:14px}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,245,242,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom));z-index:10}.nav-inner{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;padding:7px 0;color:#A39C94;font-weight:700}.nav button.active{color:var(--text)}.header{height:52px;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}.back{border:0;background:none;font-size:28px;padding:0}.choice{cursor:pointer}.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px 16px;font-size:15px;outline:none;margin:8px 0 18px}.label{font-size:13px;color:var(--sub)}.pulse{font-size:34px;animation:heartbeat 1.2s ease 1;color:var(--accent)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.story-copy{font-size:15px;line-height:1.68;margin:14px 0 4px}.story-title{font-size:20px;line-height:1.4;font-weight:800;letter-spacing:-.025em;margin:8px 0}.softbox{background:#F4F0EB;border-radius:18px;padding:15px 16px;margin-top:14px}.progress{display:flex;gap:6px;margin:12px 0 26px}.progress span{height:4px;border-radius:999px;background:#DED7CF;flex:1}.progress span.on{background:var(--deep)}.dev-reset{position:fixed;top:12px;right:12px;z-index:30;border:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(10px);color:#8A837C;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.04)}@keyframes heartbeat{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}40%{transform:scale(1)}60%{transform:scale(1.1)}}
</style></head><body><button class="dev-reset" onclick="resetDemo()">↻ 초기화</button><div id="app" class="app"></div><div class="nav"><div class="nav-inner"><button data-tab="home" class="active">홈</button><button data-tab="find">찾기</button><button data-tab="me">나</button></div></div>
<script>
const app=document.getElementById('app');let tab='home';let state=JSON.parse(localStorage.getItem('dugeun-v2-demo')||'{"status":"empty"}');let findMode=null;let step=0;let form={name:'',context:'',when:'',memory:'',event:''};let storyFlow=null;let verifyStep=0;const story={context:'단국대 축제 · 어제 저녁',story:'비가 많이 왔을 때 우산을 잠깐 같이 썼던 분을 찾고 있어요. 별 이야기는 못 했는데 계속 생각나요.'};
function save(){localStorage.setItem('dugeun-v2-demo',JSON.stringify(state))}function resetDemo(){localStorage.removeItem('dugeun-v2-demo');state={status:'empty'};tab='home';findMode=null;step=0;storyFlow=null;verifyStep=0;form={name:'',context:'',when:'',memory:'',event:''};document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='home'));render()}function setTab(t){tab=t;storyFlow=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}function button(text,action,secondary=false,ghost=false){return `<button class="btn ${secondary?'secondary':''} ${ghost?'ghost':''}" onclick="${action}">${text}</button>`}
function home(){if(storyFlow)return storyVerify();const heroes={empty:['다시 마주하고 싶은 사람이 있나요?','현실에서 스친 사람을 찾거나, 이미 마음에 있는 사람을 조용히 담아보세요.'],searching:['그 사람을 찾고 있어요.','아직 새로운 소식은 없어요. 필요한 만큼만 찾는 범위를 넓혀요.'],heart:['마음에 담아두었어요.','현실에서 다시 마주치는 순간만 두근이 알려줄 수 있어요.'],pulse:['누군가의 마음이 가까워졌어요.','누군지 보여주지 않아요. 지금의 순간만 느껴보세요.'],mutual:['서로의 마음이 같아요.','이제 앱보다 현실에서 이어가는 편이 더 중요해요.']};const h=heroes[state.status||'empty'];let extra='';if(state.status==='empty')extra=button('사람 찾기',"setTab('find')")+button('이미 마음에 있는 사람이 있어요',"state.status='heart';save();render()",true);if(state.status==='searching')extra='<div class="card"><div class="eyebrow">찾는 중</div><div class="story-title">마음이 닿을 사람을 찾고 있어요.</div><p class="muted">먼저 비공개로 찾고, 필요할 때만 관련된 사람과 숲으로 범위를 넓히는 구조예요.</p></div>';if(state.status==='heart')extra='<div class="card"><div class="eyebrow">마음에 담김</div><div class="story-title">두근을 켤 수 있어요.</div><p class="muted">위치 권한은 지금 이 순간에만 요청합니다. 현재 위치나 이동경로를 상대에게 보여주지 않아요.</p>'+button('데모로 두근 보기',"state.status='pulse';save();render()")+'</div>';if(state.status==='pulse')extra='<div class="card" style="background:var(--accentSoft);border-color:#FFD2DB"><div class="pulse">♥</div><div class="story-title">두근</div><p class="muted">거리, 방향, 현재 근처 여부는 보여주지 않아요.</p>'+button('데모로 서로 확인하기',"state.status='mutual';save();render()")+'</div>';if(state.status==='mutual')extra='<div class="card"><div class="eyebrow">서로</div><div class="story-title">이제 현실에서 이어가도 좋을 것 같아요.</div><p class="muted">정체가 아직 확실하지 않다면 양쪽 모두 원할 때만 확인하도록 이어집니다.</p></div>';return `<div class="screen"><div class="brand">두근</div><div class="hero">${['pulse','mutual'].includes(state.status)?'<div class="pulse">♥</div>':''}<h1>${h[0]}</h1><p>${h[1]}</p></div>${extra}<div class="section"><div class="section-title">당신과 닮은 기억이 있어요</div><div class="section-desc">누군가 남긴 기억 중, 당신이 떠올릴 만한 이야기예요.</div><div class="card event-card"><div class="row"><span class="tag">${story.context}</span><span class="eyebrow">데모</span></div><div class="story-title">혹시, 그날의 사람이 당신일까요?</div><p class="story-copy">${story.story}</p>${button('조금 더 기억해볼게요',"storyFlow='verify';verifyStep=0;render()",true)}${button('아닌 것 같아요',"storyFlow='dismissed';render()",false,true)}</div></div></div>`}
function storyVerify(){if(storyFlow==='dismissed')return `<div class="screen"><div class="header"><button class="back" onclick="storyFlow=null;render()">‹</button>내 이야기일지도</div><div class="hero"><h1>괜찮아요.</h1><p>아닌 것 같은 이야기는 조용히 넘길 수 있어요. 누가 확인했는지는 작성자에게 알려지지 않아요.</p></div>${button('홈으로',"storyFlow=null;render()")}</div>`;if(storyFlow==='verified')return `<div class="screen"><div class="header"><button class="back" onclick="storyFlow=null;render()">‹</button>같은 순간</div><div class="hero"><div class="pulse">♥</div><h1>서로 같은 순간을 기억하고 있는 것 같아요.</h1><p>아직 상대의 정체를 공개하지 않아요. 이 사람에게 마음이 있다면 그때만 다음 단계로 넘어가요.</p></div><div class="card"><span class="tag">${story.context}</span><p class="story-copy">${story.story}</p></div>${button('이 사람을 마음에 담기',"state.status='heart';save();storyFlow=null;render()")}${button('여기까지만 볼게요',"storyFlow=null;render()",true)}</div>`;const questions=[['그날 비가 왔던 게 기억나나요?','작성자가 공개하지 않은 세부 기억과 서로 어긋나지 않는지만 확인해요.'],['공연이 끝난 뒤 잠깐 같이 걸었던 일이 있었나요?','정답을 맞히는 퀴즈가 아니라, 둘만 아는 순간이 겹치는지 보는 단계예요.']];const q=questions[verifyStep];return `<div class="screen"><div class="header"><button class="back" onclick="verifyStep?(verifyStep--,render()):(storyFlow=null,render())">‹</button>기억 확인</div><div class="progress"><span class="on"></span><span class="${verifyStep>0?'on':''}"></span></div><div class="eyebrow">${verifyStep+1} / 2</div><div class="hero" style="padding-top:24px"><h1>${q[0]}</h1><p>${q[1]}</p></div><div class="softbox"><div class="eyebrow">안전하게 확인해요</div><p class="muted">이 답은 공개 댓글로 보이지 않고, 상대를 추적할 수 있는 위치 정보도 보여주지 않아요.</p></div>${button('네, 기억나요',verifyStep===0?"verifyStep=1;render()":"storyFlow='verified';render()")}${button('아닌 것 같아요',"storyFlow='dismissed';render()",true)}</div>`}
function find(){if(!findMode)return `<div class="screen"><div class="header">찾기</div><div class="hero" style="padding-top:18px"><h1>어떤 사람을 찾고 있나요?</h1><p>이름을 알아도, 몰라도 시작할 수 있어요.</p></div><div class="card choice" onclick="findMode='known';render()"><div class="story-title">이름을 알아요</div><p class="muted">이름과 공개된 소속 정보로 찾기</p></div><div class="card choice" onclick="findMode='unknown';render()"><div class="story-title">이름을 몰라요</div><p class="muted">어디서, 언제, 어떤 순간이었는지로 찾기</p></div><div class="section"><div class="section-title">숲</div><div class="section-desc">게시판이 아니라, 못 찾았을 때 범위를 넓히는 마지막 단계예요.</div><div class="card"><span class="tag">${story.context}</span><p class="story-copy">${story.story}</p></div></div></div>`;if(findMode==='known')return `<div class="screen"><div class="header"><button class="back" onclick="resetFind()">‹</button>이름으로 찾기</div><label class="label">이름</label><input id="name" class="input" placeholder="이름을 입력해 주세요"><label class="label">소속이나 기억나는 정보</label><input id="context" class="input" placeholder="예: 단국대, 2학년"><p class="muted">현재 위치, 최근 동선, 몇 번 마주쳤는지 같은 정보는 검색 조건으로 쓰지 않습니다.</p>${button('마음에 담기',"state.status='heart';save();resetFind();setTab('home')")}</div>`;const steps=[['어디에서 만났나요?','장소나 행사 정도만 적어주세요.','context','예: 단국대 축제, 강남역 근처 카페'],['언제였나요?','정확한 시각은 내부 매칭에만 쓸 수 있어요.','when','예: 어제 저녁 7시쯤'],['무엇이 기억나나요?','옷, 물건, 대화처럼 그 순간을 떠올릴 단서를 적어주세요.','memory','예: 검은 모자, 노란 우산'],['어떤 일이 있었나요?','공개 카드에는 이 이야기가 중심이 됩니다.','event','예: 비가 와서 우산을 잠깐 같이 썼어요']];const s=steps[step];return `<div class="screen"><div class="header"><button class="back" onclick="step?(step--,render()):resetFind()">‹</button>기억으로 찾기</div><div class="progress">${steps.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div><div class="eyebrow">${step+1} / ${steps.length}</div><div class="hero" style="padding-top:20px"><h1>${s[0]}</h1><p>${s[1]}</p></div>${s[2]==='event'?`<textarea id="field" class="input" style="min-height:150px" placeholder="${s[3]}">${form[s[2]]}</textarea>`:`<input id="field" class="input" placeholder="${s[3]}" value="${form[s[2]]}">`}${['when','memory'].includes(s[2])?'<div class="softbox"><div class="eyebrow">공개되지 않아요</div><p class="muted">이 내용은 공개 글에는 보이지 않고, 찾는 데만 사용되도록 설계합니다.</p></div>':''}${button(step===3?'찾기 시작하기':'다음',"nextFind('"+s[2]+"')")}</div>`}
function nextFind(key){form[key]=document.getElementById('field').value;if(!form[key].trim())return;if(step<3){step++;render()}else{state.status='searching';save();resetFind();setTab('home')}}function resetFind(){findMode=null;step=0;form={name:'',context:'',when:'',memory:'',event:''};render()}function me(){return `<div class="screen"><div class="header">나</div><div class="card"><div class="story-title">두근 데모</div><p class="muted">현재는 로컬 데모 상태입니다. 실제 사용자, 실제 호감, 실제 활동 데이터를 만들지 않습니다.</p></div><div class="card"><b>개인정보 원칙</b><p class="muted">사람을 찾는 것은 허용하지만, 위치 상태를 추적하는 기능은 만들지 않습니다.</p></div>${button('데모 상태 초기화',"resetDemo()",true)}</div>`}function render(){app.innerHTML=tab==='home'?home():tab==='find'?find():me()}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));render();
</script></body></html>
