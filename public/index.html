<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F5F2"><title>두근</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>:root{--bg:#F7F5F2;--text:#201F1D;--sub:#716C66;--line:#E7E1DA;--accent:#F36B7F}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:20px 18px 110px}.brand{font-size:14px;color:var(--sub);margin-bottom:32px}.hero{padding:30px 0 20px}.hero h1{font-size:30px;line-height:1.2;letter-spacing:-.045em;margin:0 0 14px}.hero p,.muted{color:var(--sub);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0}.btn{width:100%;border:0;border-radius:16px;padding:15px 17px;margin-top:10px;background:#292724;color:#fff;font-weight:750}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--sub)}input,textarea{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 15px;margin:7px 0 14px;outline:none;font:inherit}textarea{min-height:88px;resize:vertical}.label{font-size:13px;color:var(--sub)}.msg{font-size:13px;line-height:1.5;margin:10px 0}.error{color:#B84656}.ok{color:#35725B}.nav{position:fixed;bottom:0;left:0;right:0;background:#f7f5f2f2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;color:#A19A93;font-weight:700;padding:7px}.nav button.on{color:var(--text)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#F1EDE8;color:var(--sub);font-size:12px}.name{font-size:18px;font-weight:800}.small{font-size:12px;color:var(--sub);line-height:1.5}.pulse{font-size:34px;color:var(--accent);animation:beat 1.2s ease 1}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dev{position:fixed;right:12px;top:12px;z-index:20;border:1px solid var(--line);background:#ffffffdd;border-radius:999px;padding:7px 10px;font-size:11px;color:#817A73}.hide{display:none}@keyframes beat{20%{transform:scale(1.15)}40%{transform:scale(1)}60%{transform:scale(1.1)}}</style></head><body><button class="dev" onclick="devReset()">↻ 화면 초기화</button><main id="app" class="app"></main><nav id="nav" class="nav hide"><div class="navin"><button data-t="home" class="on">홈</button><button data-t="find">찾기</button><button data-t="me">나</button></div></nav><script>
const URL='https://pcaaqfbrknwvaxbzzkkn.supabase.co',KEY='sb_publishable_QMyLUQkQ6PVrE-ips4lLLg_qtp9WtzA',app=document.getElementById('app'),nav=document.getElementById('nav');let tab='home',mode='main',session=JSON.parse(localStorage.getItem('dugeun-session')||'null'),profile=null,status=null,results=[],memories=[],myFinds=[],verifications=[],candidates={},notice='',noticeType='ok';const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const msg=()=>notice?`<div class="msg ${noticeType}">${esc(notice)}</div>`:'';function setNotice(t,type='ok'){notice=t;noticeType=type;render()}function headers(auth=true){let h={apikey:KEY,'Content-Type':'application/json'};if(auth&&session?.access_token)h.Authorization='Bearer '+session.access_token;return h}async function req(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})}}),text=await r.text(),d;try{d=text?JSON.parse(text):null}catch{d=text}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||d?.error||'요청에 실패했어요.');return d}async function rpc(n,b={}){return req('/rest/v1/rpc/'+n,{method:'POST',body:JSON.stringify(b)})}
async function signup(){let e=email.value.trim(),p=pw.value;if(p.length<6)return setNotice('비밀번호는 6자 이상 입력해 주세요.','error');try{let d=await req('/auth/v1/signup',{method:'POST',auth:false,body:JSON.stringify({email:e,password:p})});if(d.access_token){saveSession(d);await boot()}else setNotice('이메일 확인 후 로그인해 주세요.')}catch(e){setNotice(e.message,'error')}}async function login(){try{let d=await req('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email:email.value.trim(),password:pw.value})});saveSession(d);await boot()}catch(e){setNotice(e.message,'error')}}function saveSession(d){session=d;localStorage.setItem('dugeun-session',JSON.stringify(d))}async function logout(){try{await req('/auth/v1/logout',{method:'POST'})}catch{}localStorage.removeItem('dugeun-session');session=profile=status=null;render()}async function boot(){if(!session)return render();try{let u=await req('/auth/v1/user');session.user=u;let p=await req('/rest/v1/profiles?select=user_id,name,school,grade&user_id=eq.'+u.id);profile=p?.[0]||null;if(profile)await refresh()}catch{localStorage.removeItem('dugeun-session');session=null}render()}async function refresh(){await Promise.all([loadStatus(),loadMemories(),loadMine(),loadVerifications()])}async function loadStatus(){try{status=await rpc('dugeun_relationship_status')}catch{status=null}}async function loadMemories(){try{memories=await rpc('dugeun_relevant_memories')}catch{memories=[]}}async function loadMine(){try{myFinds=await rpc('dugeun_my_memory_finds')}catch{myFinds=[]}}async function loadVerifications(){try{verifications=await rpc('dugeun_pending_memory_verifications')}catch{verifications=[]}}
async function saveProfile(){let name=pname.value.trim(),s=school.value.trim(),g=grade.value.trim();if(!name||!s||!g)return setNotice('모두 입력해 주세요.','error');try{await req('/rest/v1/profiles?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:session.user.id,name,school:s,grade:g,updated_at:new Date().toISOString()})});profile={user_id:session.user.id,name,school:s,grade:g};await refresh();render()}catch(e){setNotice(e.message,'error')}}async function searchPeople(){let n=qname.value.trim(),c=qctx.value.trim();if(n.length<2)return setNotice('이름을 2자 이상 입력해 주세요.','error');try{results=await rpc('dugeun_search_profiles',{p_name:n,p_context:c||null});render()}catch(e){setNotice(e.message,'error')}}async function crush(id){try{let d=await rpc('dugeun_register_crush',{p_target_user:id});await loadStatus();tab='home';mode='main';setNotice(d.mutual?'서로의 마음이 같아요.':'마음에 담았어요.')}catch(e){setNotice(e.message,'error')}}async function createMemory(){let v=[mplace.value.trim(),mtime.value.trim(),mmemory.value.trim(),mstory.value.trim()];if(v.some(x=>!x))return setNotice('공개 기억 네 항목을 모두 입력해 주세요.','error');try{await rpc('dugeun_create_memory_find',{p_place:v[0],p_time:v[1],p_memory:v[2],p_story:v[3],p_private_clue:mprivate.value.trim()||null});await loadMine();mode='mine';setNotice('기억을 저장했어요. 처음에는 비공개예요.')}catch(e){setNotice(e.message,'error')}}async function expandFind(id,stage){try{await rpc('dugeun_expand_memory_find',{p_find_id:id,p_stage:stage});await loadMine();setNotice(stage==='related'?'관련된 사람들에게 닿게 했어요.':'숲에 조용히 공개했어요.')}catch(e){setNotice(e.message,'error')}}async function respondMemory(id,a){try{await rpc('dugeun_respond_memory_find',{p_find_id:id,p_answer:a});await loadVerifications();setNotice(a==='maybe'?'작성자에게 “내 이야기일지도”를 보냈어요.':'조용히 넘겼어요.')}catch(e){setNotice(e.message,'error')}}async function loadCandidates(id){try{candidates[id]=await rpc('dugeun_memory_find_candidates',{p_find_id:id});render()}catch(e){setNotice(e.message,'error')}}async function askVerify(fid,uid){let q=document.getElementById('vq-'+uid).value.trim(),a=document.getElementById('va-'+uid).value.trim();try{await rpc('dugeun_set_memory_verification',{p_find_id:fid,p_responder:uid,p_question:q,p_answer:a});await loadCandidates(fid);setNotice('확인 질문을 보냈어요. 정답은 상대에게 보이지 않아요.')}catch(e){setNotice(e.message,'error')}}async function answerVerify(fid){let a=document.getElementById('ans-'+fid).value.trim();try{await rpc('dugeun_answer_memory_verification',{p_find_id:fid,p_answer:a});await loadVerifications();setNotice('답을 보냈어요. 작성자가 같은 기억인지 확인할 수 있어요.')}catch(e){setNotice(e.message,'error')}}async function reviewVerify(fid,uid,ok){try{await rpc('dugeun_review_memory_verification',{p_find_id:fid,p_responder:uid,p_accept:ok});await loadCandidates(fid);setNotice(ok?'서로 같은 순간을 기억하고 있는 것 같아요. 이제 마음에 담을 수 있어요.':'다른 기억인 것 같아 조용히 종료했어요.')}catch(e){setNotice(e.message,'error')}}
function authView(){nav.classList.add('hide');return `<div class="brand">두근</div><div class="hero"><h1>현실에서 시작된 마음을<br>다시 이어보세요.</h1></div><div class="card"><input id="email" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호">${msg()}<button class="btn" onclick="login()">로그인</button><button class="btn secondary" onclick="signup()">처음이에요 · 가입하기</button></div>`}function profileView(){nav.classList.add('hide');return `<div class="brand">두근</div><div class="hero"><h1>당신을 구별할 수 있게<br>조금만 알려주세요.</h1></div><input id="pname" placeholder="이름"><input id="school" placeholder="소속"><input id="grade" placeholder="학년 또는 구분">${msg()}<button class="btn" onclick="saveProfile()">시작하기</button>`}
function home(){let h=['다시 마주하고 싶은 사람이 있나요?','사람을 찾거나 기억을 남겨보세요.'];if(status?.has_mutual)h=['서로의 마음이 같아요.','둘 다 마음에 담았을 때만 이 사실을 알려줘요.'];else if(status?.has_incoming)h=['누군가 당신을 마음에 담았어요.','누구인지는 보여주지 않아요.'];else if(status?.outgoing_count)h=['마음에 담아두었어요.','상대의 선택을 조용히 기다리고 있어요.'];return `<div class="brand">두근</div><div class="hero">${status?.has_mutual?'<div class="pulse">♥</div>':''}<h1>${h[0]}</h1><p>${h[1]}</p></div>${msg()}${verifications.length?`<div class="hero"><h1 style="font-size:22px">같은 순간인지 확인해볼까요?</h1><p>정답을 맞히는 시험이 아니라, 둘만 기억할 만한 순간을 확인하는 과정이에요.</p></div>${verifyCards()}`:''}<button class="btn" onclick="go('find')">사람 찾기</button>${memories.length?`<div class="hero"><h1 style="font-size:22px">당신과 닮은 기억이 있어요</h1></div>${memoryCards(memories.slice(0,3))}`:''}`}
function verifyCards(){return verifications.map(v=>`<div class="card"><span class="tag">${esc(v.place_public)} · ${esc(v.time_public)}</span><p>${esc(v.story_public)}</p><div class="name">${esc(v.question)}</div>${v.answered?`<p class="muted">답을 보냈어요. 작성자의 확인을 기다리고 있어요.</p>`:`<label class="label">당신의 기억</label><input id="ans-${v.find_id}" placeholder="기억나는 대로 답해주세요"><button class="btn" onclick="answerVerify('${v.find_id}')">답 보내기</button>`}</div>`).join('')}function memoryCards(list){return list.map(m=>`<div class="card"><span class="tag">${esc(m.place_public)} · ${esc(m.time_public)}</span><div class="name" style="margin-top:14px">혹시, 그날의 사람이 당신일까요?</div><p>${esc(m.story_public)}</p><p class="muted">${esc(m.memory_public)}</p><div class="choice"><button class="btn secondary" onclick="respondMemory('${m.id}','no')">아닌 것 같아요</button><button class="btn" onclick="respondMemory('${m.id}','maybe')">내 이야기일지도</button></div></div>`).join('')}
function find(){if(mode==='memory')return memoryForm();if(mode==='browse')return `<div class="brand">찾기 · 기억</div><div class="hero"><h1>누군가 남긴 기억</h1></div>${memoryCards(memories)}<button class="btn ghost" onclick="mode='main';render()">돌아가기</button>`;if(mode==='mine')return mineView();return `<div class="brand">찾기</div><div class="hero"><h1>어떤 사람을 찾고 있나요?</h1><p>사람은 찾을 수 있지만 위치나 행동을 추적할 수는 없어요.</p></div><div class="card"><div class="name">이름을 알아요</div><input id="qname" placeholder="이름"><input id="qctx" placeholder="소속 또는 학년 · 선택"><button class="btn" onclick="searchPeople()">검색하기</button>${results.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="muted">${esc(p.school)} · ${esc(p.grade)}</div><button class="btn secondary" onclick="crush('${p.user_id}')">마음에 담기</button></div>`).join('')}</div><div class="card"><div class="name">이름을 몰라요</div><p class="muted">장소와 순간을 기억으로 남겨 찾아보세요.</p><button class="btn secondary" onclick="mode='memory';render()">기억으로 찾기</button></div><div class="choice"><button class="btn ghost" onclick="mode='browse';loadMemories().then(render)">공개된 기억</button><button class="btn ghost" onclick="mode='mine';loadMine().then(render)">내가 찾는 사람</button></div>${msg()}`}
function memoryForm(){return `<div class="brand">기억으로 찾기</div><div class="hero"><h1>그 순간을 기억나는 만큼<br>남겨주세요.</h1></div><input id="mplace" placeholder="어디에서 만났나요?"><input id="mtime" placeholder="언제였나요?"><input id="mmemory" placeholder="무엇이 기억나나요?"><textarea id="mstory" placeholder="어떤 일이 있었나요?"></textarea><label class="label">공개되지 않는 정확한 단서</label><textarea id="mprivate"></textarea>${msg()}<button class="btn" onclick="createMemory()">비공개로 찾기 시작</button><button class="btn ghost" onclick="mode='main';render()">취소</button>`}
function mineView(){return `<div class="brand">내가 찾는 사람</div><div class="hero"><h1>남겨둔 기억</h1></div>${msg()}${myFinds.map(m=>`<div class="card"><span class="tag">${esc(m.reach_stage)}</span><div class="name" style="margin-top:12px">${esc(m.place_public)} · ${esc(m.time_public)}</div><p>${esc(m.story_public)}</p>${m.reach_stage==='private'?`<button class="btn secondary" onclick="expandFind('${m.id}','related')">관련된 사람들에게 닿게 하기</button>`:''}${m.reach_stage==='related'?`<button class="btn secondary" onclick="expandFind('${m.id}','forest')">숲에 공개하기</button>`:''}<button class="btn ghost" onclick="loadCandidates('${m.id}')">내 이야기일지도 확인</button>${candidateCards(m.id)}</div>`).join('')||'<div class="card muted">아직 남긴 기억이 없어요.</div>'}<button class="btn ghost" onclick="mode='main';render()">돌아가기</button>`}
function candidateCards(fid){return (candidates[fid]||[]).map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="muted">${esc(c.school)} · ${esc(c.grade)}</div>${c.verified?`<p class="ok">서로 같은 순간을 기억하고 있는 것 같아요.</p><button class="btn" onclick="crush('${c.responder_user}')">이 사람을 마음에 담기</button>`:c.responder_answer?`<p class="label">내가 보낸 질문</p><p>${esc(c.question)}</p><p class="label">상대의 답</p><p>${esc(c.responder_answer)}</p><div class="choice"><button class="btn secondary" onclick="reviewVerify('${fid}','${c.responder_user}',false)">다른 사람 같아요</button><button class="btn" onclick="reviewVerify('${fid}','${c.responder_user}',true)">같은 기억이에요</button></div>`:c.question?`<p class="muted">확인 질문을 보냈어요. 답을 기다리고 있어요.</p>`:`<p class="muted">바로 마음에 담기 전에 둘만 알 만한 기억을 한 번 확인해요.</p><input id="vq-${c.responder_user}" placeholder="예: 그때 제가 들고 있던 건 뭐였나요?"><input id="va-${c.responder_user}" placeholder="내가 기억하는 답 · 상대에게 비공개"><button class="btn secondary" onclick="askVerify('${fid}','${c.responder_user}')">확인 질문 보내기</button>`}</div>`).join('')}
function me(){return `<div class="brand">나</div><div class="hero"><h1>${esc(profile.name)}</h1><p>${esc(profile.school)} · ${esc(profile.grade)}</p></div><div class="card"><div class="row"><span>보낸 마음</span><b>${status?.outgoing_count??0}</b></div><div class="row" style="margin-top:12px"><span>받은 마음</span><b>${status?.incoming_count??0}</b></div></div><button class="btn secondary" onclick="refresh().then(render)">상태 새로고침</button><button class="btn ghost" onclick="logout()">로그아웃</button>`}function go(t){tab=t;mode='main';notice='';results=[];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}function render(){if(!session){app.innerHTML=authView();return}if(!profile){app.innerHTML=profileView();return}nav.classList.remove('hide');app.innerHTML=tab==='home'?home():tab==='find'?find():me()}function devReset(){tab='home';mode='main';notice='';results=[];refresh().then(render)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));boot();
</script></body></html>
