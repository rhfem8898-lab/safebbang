<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F5F2"><title>두근</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>:root{--bg:#F7F5F2;--text:#201F1D;--sub:#716C66;--line:#E7E1DA;--white:#fff;--accent:#F36B7F;--pink:#FFE9EE}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:20px 18px 110px}.brand{font-size:14px;color:var(--sub);margin-bottom:38px}.hero{padding:35px 0 25px}.hero h1{font-size:31px;line-height:1.2;letter-spacing:-.045em;margin:0 0 14px}.hero p,.muted{color:var(--sub);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0}.btn{width:100%;border:0;border-radius:16px;padding:15px 17px;margin-top:10px;background:#292724;color:#fff;font-weight:750}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--sub)}input{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 15px;margin:7px 0 14px;outline:none;font:inherit}.label{font-size:13px;color:var(--sub)}.msg{font-size:13px;line-height:1.5;margin:10px 0}.error{color:#B84656}.ok{color:#35725B}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(247,245,242,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;color:#A19A93;font-weight:700;padding:7px}.nav button.on{color:var(--text)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#F1EDE8;color:var(--sub);font-size:12px}.name{font-size:18px;font-weight:800}.small{font-size:12px;color:var(--sub)}.pulse{font-size:34px;color:var(--accent);animation:beat 1.2s ease 1}.dev{position:fixed;right:12px;top:12px;z-index:20;border:1px solid var(--line);background:#ffffffdd;border-radius:999px;padding:7px 10px;font-size:11px;color:#817A73}.hide{display:none}@keyframes beat{20%{transform:scale(1.15)}40%{transform:scale(1)}60%{transform:scale(1.1)}}</style></head><body><button class="dev" onclick="devReset()">↻ 화면 초기화</button><main id="app" class="app"></main><nav id="nav" class="nav hide"><div class="navin"><button data-t="home" class="on">홈</button><button data-t="find">찾기</button><button data-t="me">나</button></div></nav><script>
const URL='https://pcaaqfbrknwvaxbzzkkn.supabase.co';const KEY='sb_publishable_QMyLUQkQ6PVrE-ips4lLLg_qtp9WtzA';const app=document.getElementById('app'),nav=document.getElementById('nav');let tab='home',session=JSON.parse(localStorage.getItem('dugeun-session')||'null'),profile=null,status=null,results=[],notice='',noticeType='ok';
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function msg(){return notice?`<div class="msg ${noticeType}">${esc(notice)}</div>`:''}function setNotice(t,type='ok'){notice=t;noticeType=type;render()}function headers(auth=true){const h={'apikey':KEY,'Content-Type':'application/json'};if(auth&&session?.access_token)h.Authorization='Bearer '+session.access_token;return h}async function req(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})}});let text=await r.text(),data;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||'요청에 실패했어요.');return data}
async function signup(){notice='';const email=document.getElementById('email').value.trim(),password=document.getElementById('pw').value;if(password.length<6)return setNotice('비밀번호는 6자 이상 입력해 주세요.','error');try{const d=await req('/auth/v1/signup',{method:'POST',auth:false,body:JSON.stringify({email,password})});if(d.access_token){saveSession(d);await boot()}else setNotice('가입 요청이 완료됐어요. 이메일 확인 후 로그인해 주세요.')}catch(e){setNotice(e.message,'error')}}async function login(){notice='';const email=document.getElementById('email').value.trim(),password=document.getElementById('pw').value;try{const d=await req('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email,password})});saveSession(d);await boot()}catch(e){setNotice(e.message,'error')}}function saveSession(d){session=d;localStorage.setItem('dugeun-session',JSON.stringify(d))}async function logout(){try{if(session)await req('/auth/v1/logout',{method:'POST'})}catch{}localStorage.removeItem('dugeun-session');session=null;profile=null;status=null;tab='home';render()}
async function boot(){if(!session){render();return}try{const u=await req('/auth/v1/user');session.user=u;localStorage.setItem('dugeun-session',JSON.stringify(session));const rows=await req('/rest/v1/profiles?select=user_id,name,school,grade&user_id=eq.'+encodeURIComponent(u.id));profile=rows?.[0]||null;if(profile)await loadStatus();notice=''}catch(e){localStorage.removeItem('dugeun-session');session=null;notice='세션이 만료됐어요. 다시 로그인해 주세요.';noticeType='error'}render()}
async function saveProfile(){const name=document.getElementById('pname').value.trim(),school=document.getElementById('school').value.trim(),grade=document.getElementById('grade').value.trim();if(!name||!school||!grade)return setNotice('이름, 소속, 학년/구분을 모두 입력해 주세요.','error');try{await req('/rest/v1/profiles?on_conflict=user_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify({user_id:session.user.id,name,school,grade,updated_at:new Date().toISOString()})});profile={user_id:session.user.id,name,school,grade};notice='프로필을 저장했어요.';noticeType='ok';await loadStatus();render()}catch(e){setNotice(e.message,'error')}}
async function rpc(name,body={}){return req('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(body)})}async function loadStatus(){try{status=await rpc('dugeun_relationship_status')}catch{status=null}}async function searchPeople(){const n=document.getElementById('qname').value.trim(),c=document.getElementById('qctx').value.trim();if(n.length<2)return setNotice('이름을 2자 이상 입력해 주세요.','error');try{results=await rpc('dugeun_search_profiles',{p_name:n,p_context:c||null});notice=results.length?`${results.length}명을 찾았어요.`:'조건에 맞는 사람을 찾지 못했어요.';noticeType='ok';render()}catch(e){setNotice(e.message,'error')}}async function crush(id){try{const d=await rpc('dugeun_register_crush',{p_target_user:id});await loadStatus();notice=d.mutual?'서로의 마음이 같아요.':'마음에 담았어요. 상대에게 당신의 정체는 공개되지 않아요.';noticeType='ok';tab='home';render()}catch(e){setNotice(e.message,'error')}}
function authView(){nav.classList.add('hide');return `<div class="brand">두근</div><div class="hero"><h1>현실에서 시작된 마음을<br>다시 이어보세요.</h1><p>먼저 계정으로 들어와 주세요. 실제 사용자끼리 검색하고 마음을 담는 단계부터 연결되어 있어요.</p></div><div class="card"><label class="label">이메일</label><input id="email" type="email" autocomplete="email" placeholder="email@example.com"><label class="label">비밀번호</label><input id="pw" type="password" autocomplete="current-password" placeholder="6자 이상">${msg()}<button class="btn" onclick="login()">로그인</button><button class="btn secondary" onclick="signup()">처음이에요 · 가입하기</button></div><p class="small">현재 MVP는 이메일 인증을 사용합니다. 실제 서비스에서는 휴대폰 인증 등으로 교체할 수 있어요.</p>`}
function profileView(){nav.classList.add('hide');return `<div class="brand">두근</div><div class="hero"><h1>당신을 구별할 수 있게<br>조금만 알려주세요.</h1><p>검색에 필요한 최소 정보만 저장해요.</p></div><label class="label">이름</label><input id="pname" placeholder="이름"><label class="label">소속</label><input id="school" placeholder="예: 단국대"><label class="label">학년 또는 구분</label><input id="grade" placeholder="예: 2학년">${msg()}<button class="btn" onclick="saveProfile()">시작하기</button><button class="btn ghost" onclick="logout()">다른 계정으로 로그인</button>`}
function home(){let hero=['다시 마주하고 싶은 사람이 있나요?','사람을 찾고 마음에 담아보세요. 상대에게 바로 알려지지는 않아요.'],extra='';if(status?.has_mutual){hero=['서로의 마음이 같아요.','둘 다 마음에 담았을 때만 서로였다는 사실을 알려줘요.'];extra='<div class="card"><div class="pulse">♥</div><div class="name">서로</div><p class="muted">정체 확인은 다음 단계에서 양쪽이 모두 원할 때만 연결할 예정이에요.</p></div>'}else if(status?.has_incoming){hero=['누군가 당신을 마음에 담았어요.','누구인지는 보여주지 않아요. 당신의 마음은 당신이 직접 선택해요.'];extra='<div class="card"><span class="tag">익명 호감</span><p class="muted">현재 실제 DB에 들어온 마음이 있어요. 후보 목록이나 위치 정보는 제공하지 않습니다.</p></div>'}else if(status?.outgoing_count>0){hero=['마음에 담아두었어요.','상대의 선택을 기다리는 동안 정체나 위치를 추적할 수 없어요.'];extra='<div class="card"><span class="tag">마음에 담김</span><p class="muted">마음을 보낸 사람의 신원은 상대에게 공개되지 않았어요.</p></div>'}return `<div class="brand">두근</div><div class="hero">${status?.has_mutual?'<div class="pulse">♥</div>':''}<h1>${hero[0]}</h1><p>${hero[1]}</p></div>${extra}${msg()}<button class="btn" onclick="go('find')">사람 찾기</button><div class="card"><span class="tag">실제 연결</span><p class="muted">이 화면의 호감 상태는 데모 숫자가 아니라 현재 로그인 계정의 Supabase 데이터에서 읽습니다.</p></div>`}
function find(){return `<div class="brand">찾기</div><div class="hero"><h1>이름을 아는 사람을<br>찾아보세요.</h1><p>현재 위치·최근 동선·마주친 횟수는 검색에 사용하지 않아요.</p></div><label class="label">이름</label><input id="qname" placeholder="2자 이상"><label class="label">소속 또는 학년 · 선택</label><input id="qctx" placeholder="예: 단국대"><button class="btn" onclick="searchPeople()">검색하기</button>${msg()}<div>${results.map(p=>`<div class="card"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.school)} · ${esc(p.grade)}</div></div><span class="tag">프로필</span></div><button class="btn secondary" onclick="crush('${p.user_id}')">마음에 담기</button></div>`).join('')}</div><div class="card"><div class="name">이름을 모르는 사람</div><p class="muted">기억 기반 찾기와 숲은 다음 단계에서 실제 DB에 연결할 예정이에요.</p></div>`}
function me(){return `<div class="brand">나</div><div class="hero"><h1>${esc(profile.name)}</h1><p>${esc(profile.school)} · ${esc(profile.grade)}</p></div><div class="card"><div class="row"><span>보낸 마음</span><b>${status?.outgoing_count??0}</b></div><div class="row" style="margin-top:14px"><span>받은 마음</span><b>${status?.incoming_count??0}</b></div></div><p class="small">이 수치는 현재 계정의 실제 데이터입니다. 다른 사람에게는 공개되지 않습니다.</p><button class="btn secondary" onclick="loadStatus().then(render)">상태 새로고침</button><button class="btn ghost" onclick="logout()">로그아웃</button>`}
function go(t){tab=t;notice='';results=[];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}function render(){if(!session){app.innerHTML=authView();return}if(!profile){app.innerHTML=profileView();return}nav.classList.remove('hide');app.innerHTML=tab==='home'?home():tab==='find'?find():me()}function devReset(){notice='';results=[];tab='home';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==='home'));if(session&&profile)loadStatus().then(render);else render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));boot();
</script></body></html>
