<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F5F2"><title>두근</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>:root{--bg:#F7F5F2;--text:#201F1D;--sub:#716C66;--line:#E7E1DA;--accent:#F36B7F}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:20px 18px 110px}.brand{font-size:14px;color:var(--sub);margin-bottom:32px}.hero{padding:30px 0 20px}.hero h1{font-size:30px;line-height:1.2;letter-spacing:-.045em;margin:0 0 14px}.hero p,.muted{color:var(--sub);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0}.btn{width:100%;border:0;border-radius:16px;padding:15px 17px;margin-top:10px;background:#292724;color:#fff;font-weight:750}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--sub)}input,textarea{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 15px;margin:7px 0 14px;outline:none;font:inherit}textarea{min-height:92px;resize:vertical}.label{font-size:13px;color:var(--sub)}.msg{font-size:13px;line-height:1.5;margin:10px 0}.error{color:#B84656}.ok{color:#35725B}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(247,245,242,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;color:#A19A93;font-weight:700;padding:7px}.nav button.on{color:var(--text)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#F1EDE8;color:var(--sub);font-size:12px}.name{font-size:18px;font-weight:800}.small{font-size:12px;color:var(--sub);line-height:1.5}.pulse{font-size:34px;color:var(--accent);animation:beat 1.2s ease 1}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dev{position:fixed;right:12px;top:12px;z-index:20;border:1px solid var(--line);background:#ffffffdd;border-radius:999px;padding:7px 10px;font-size:11px;color:#817A73}.hide{display:none}@keyframes beat{20%{transform:scale(1.15)}40%{transform:scale(1)}60%{transform:scale(1.1)}}</style></head><body><button class="dev" onclick="devReset()">↻ 화면 초기화</button><main id="app" class="app"></main><nav id="nav" class="nav hide"><div class="navin"><button data-t="home" class="on">홈</button><button data-t="find">찾기</button><button data-t="me">나</button></div></nav><script>
const URL='https://pcaaqfbrknwvaxbzzkkn.supabase.co',KEY='sb_publishable_QMyLUQkQ6PVrE-ips4lLLg_qtp9WtzA',app=document.getElementById('app'),nav=document.getElementById('nav');let tab='home',mode='main',session=JSON.parse(localStorage.getItem('dugeun-session')||'null'),profile=null,status=null,results=[],memories=[],myFinds=[],candidates={},notice='',noticeType='ok';
const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const msg=()=>notice?`<div class="msg ${noticeType}">${esc(notice)}</div>`:'';function setNotice(t,type='ok'){notice=t;noticeType=type;render()}function headers(auth=true){let h={apikey:KEY,'Content-Type':'application/json'};if(auth&&session?.access_token)h.Authorization='Bearer '+session.access_token;return h}async function req(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})}}),text=await r.text(),d;try{d=text?JSON.parse(text):null}catch{d=text}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||d?.error||'요청에 실패했어요.');return d}async function rpc(n,b={}){return req('/rest/v1/rpc/'+n,{method:'POST',body:JSON.stringify(b)})}
async function signup(){let e=document.getElementById('email').value.trim(),p=document.getElementById('pw').value;if(p.length<6)return setNotice('비밀번호는 6자 이상 입력해 주세요.','error');try{let d=await req('/auth/v1/signup',{method:'POST',auth:false,body:JSON.stringify({email:e,password:p})});if(d.access_token){saveSession(d);await boot()}else setNotice('이메일 확인 후 로그인해 주세요.')}catch(e){setNotice(e.message,'error')}}async function login(){try{let d=await req('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('pw').value})});saveSession(d);await boot()}catch(e){setNotice(e.message,'error')}}function saveSession(d){session=d;localStorage.setItem('dugeun-session',JSON.stringify(d))}async function logout(){try{await req('/auth/v1/logout',{method:'POST'})}catch{}localStorage.removeItem('dugeun-session');session=profile=status=null;tab='home';mode='main';render()}async function boot(){if(!session)return render();try{let u=await req('/auth/v1/user');session.user=u;localStorage.setItem('dugeun-session',JSON.stringify(session));let p=await req('/rest/v1/profiles?select=user_id,name,school,grade&user_id=eq.'+u.id);profile=p?.[0]||null;if(profile)await refresh()}catch(e){localStorage.removeItem('dugeun-session');session=null;notice='세션이 만료됐어요.';noticeType='error'}render()}async function refresh(){await Promise.all([loadStatus(),loadMemories(),loadMine()])}async function loadStatus(){try{status=await rpc('dugeun_relationship_status')}catch{status=null}}async function loadMemories(){try{memories=await rpc('dugeun_relevant_memories')}catch{memories=[]}}async function loadMine(){try{myFinds=await rpc('dugeun_my_memory_finds')}catch{myFinds=[]}}
async function saveProfile(){let name=pname.value.trim(),school=document.getElementById('school').value.trim(),grade=document.getElementById('grade').value.trim();if(!name||!school||!grade)return setNotice('모두 입력해 주세요.','error');try{await req('/rest/v1/profiles?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:session.user.id,name,school,grade,updated_at:new Date().toISOString()})});profile={user_id:session.user.id,name,school,grade};await refresh();render()}catch(e){setNotice(e.message,'error')}}async function searchPeople(){let n=qname.value.trim(),c=qctx.value.trim();if(n.length<2)return setNotice('이름을 2자 이상 입력해 주세요.','error');try{results=await rpc('dugeun_search_profiles',{p_name:n,p_context:c||null});notice=results.length?`${results.length}명을 찾았어요.`:'조건에 맞는 사람을 찾지 못했어요.';render()}catch(e){setNotice(e.message,'error')}}async function crush(id){try{let d=await rpc('dugeun_register_crush',{p_target_user:id});await loadStatus();tab='home';mode='main';setNotice(d.mutual?'서로의 마음이 같아요.':'마음에 담았어요.')}catch(e){setNotice(e.message,'error')}}
async function createMemory(){let ids=['mplace','mtime','mmemory','mstory'],v=Object.fromEntries(ids.map(x=>[x,document.getElementById(x).value.trim()]));if(Object.values(v).some(x=>!x))return setNotice('공개 기억 네 항목을 모두 입력해 주세요.','error');try{await rpc('dugeun_create_memory_find',{p_place:v.mplace,p_time:v.mtime,p_memory:v.mmemory,p_story:v.mstory,p_private_clue:document.getElementById('mprivate').value.trim()||null});await loadMine();mode='mine';setNotice('기억을 저장했어요. 처음에는 비공개 상태예요.')}catch(e){setNotice(e.message,'error')}}async function expandFind(id,stage){try{await rpc('dugeun_expand_memory_find',{p_find_id:id,p_stage:stage});await loadMine();setNotice(stage==='related'?'관련된 사람들에게 닿을 수 있게 열었어요.':'숲에 조용히 공개했어요.')}catch(e){setNotice(e.message,'error')}}async function respondMemory(id,a){try{await rpc('dugeun_respond_memory_find',{p_find_id:id,p_answer:a});setNotice(a==='maybe'?'작성자에게 “내 이야기일지도” 응답을 보냈어요. 당신의 공개 프로필만 전달돼요.':'조용히 넘겼어요.')}catch(e){setNotice(e.message,'error')}}async function loadCandidates(id){try{candidates[id]=await rpc('dugeun_memory_find_candidates',{p_find_id:id});render()}catch(e){setNotice(e.message,'error')}}
function authView(){nav.classList.add('hide');return `<div class="brand">두근</div><div class="hero"><h1>현실에서 시작된 마음을<br>다시 이어보세요.</h1><p>실제 계정으로 시작해요.</p></div><div class="card"><label class="label">이메일</label><input id="email" type="email"><label class="label">비밀번호</label><input id="pw" type="password">${msg()}<button class="btn" onclick="login()">로그인</button><button class="btn secondary" onclick="signup()">처음이에요 · 가입하기</button></div>`}function profileView(){nav.classList.add('hide');return `<div class="brand">두근</div><div class="hero"><h1>당신을 구별할 수 있게<br>조금만 알려주세요.</h1></div><label class="label">이름</label><input id="pname"><label class="label">소속</label><input id="school"><label class="label">학년 또는 구분</label><input id="grade">${msg()}<button class="btn" onclick="saveProfile()">시작하기</button>`}
function home(){let h=['다시 마주하고 싶은 사람이 있나요?','사람을 찾거나, 기억을 남겨보세요.'];if(status?.has_mutual)h=['서로의 마음이 같아요.','둘 다 마음에 담았을 때만 이 사실을 알려줘요.'];else if(status?.has_incoming)h=['누군가 당신을 마음에 담았어요.','누구인지는 보여주지 않아요.'];else if(status?.outgoing_count)h=['마음에 담아두었어요.','상대의 선택을 조용히 기다리고 있어요.'];return `<div class="brand">두근</div><div class="hero">${status?.has_mutual?'<div class="pulse">♥</div>':''}<h1>${h[0]}</h1><p>${h[1]}</p></div>${msg()}<button class="btn" onclick="go('find')">사람 찾기</button>${memories.length?`<div class="hero"><h1 style="font-size:22px">당신과 닮은 기억이 있어요</h1><p>누군가 남긴 기억 중 직접 확인해볼 수 있는 이야기예요.</p></div>${memoryCards(memories.slice(0,3))}`:''}`}
function memoryCards(list){return list.map(m=>`<div class="card"><span class="tag">${esc(m.place_public)} · ${esc(m.time_public)}</span><div class="name" style="margin-top:14px">혹시, 그날의 사람이 당신일까요?</div><p>${esc(m.story_public)}</p><p class="muted">기억: ${esc(m.memory_public)}</p><div class="choice"><button class="btn secondary" onclick="respondMemory('${m.id}','no')">아닌 것 같아요</button><button class="btn" onclick="respondMemory('${m.id}','maybe')">내 이야기일지도</button></div></div>`).join('')}
function find(){if(mode==='memory')return memoryForm();if(mode==='browse')return `<div class="brand">찾기 · 기억</div><div class="hero"><h1>누군가 남긴 기억</h1><p>좋아요나 조회수 없이, 사람을 다시 찾기 위한 이야기만 보여줘요.</p></div>${msg()}${memories.length?memoryCards(memories):'<div class="card muted">아직 공개된 기억이 없어요.</div>'}<button class="btn ghost" onclick="mode='main';render()">돌아가기</button>`;if(mode==='mine')return mineView();return `<div class="brand">찾기</div><div class="hero"><h1>어떤 사람을 찾고 있나요?</h1><p>사람 찾기는 허용하지만, 사람을 추적하는 정보는 제공하지 않아요.</p></div><div class="card"><div class="name">이름을 알아요</div><label class="label">이름</label><input id="qname" placeholder="2자 이상"><label class="label">소속 또는 학년 · 선택</label><input id="qctx"><button class="btn" onclick="searchPeople()">검색하기</button>${results.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="muted">${esc(p.school)} · ${esc(p.grade)}</div><button class="btn secondary" onclick="crush('${p.user_id}')">마음에 담기</button></div>`).join('')}</div><div class="card"><div class="name">이름을 몰라요</div><p class="muted">장소와 순간을 기억으로 남기고, 필요한 만큼만 도달 범위를 넓혀요.</p><button class="btn secondary" onclick="mode='memory';render()">기억으로 찾기</button></div><div class="choice"><button class="btn ghost" onclick="mode='browse';loadMemories().then(render)">공개된 기억 보기</button><button class="btn ghost" onclick="mode='mine';loadMine().then(render)">내가 찾는 사람</button></div>${msg()}`}
function memoryForm(){return `<div class="brand">기억으로 찾기</div><div class="hero"><h1>그 순간을 기억나는 만큼<br>남겨주세요.</h1><p>정확한 개인 단서는 공개하지 않고 찾는 데만 보관해요.</p></div><label class="label">어디에서 만났나요?</label><input id="mplace" placeholder="예: 단국대 축제"><label class="label">언제였나요?</label><input id="mtime" placeholder="예: 어제 저녁"><label class="label">무엇이 기억나나요?</label><input id="mmemory" placeholder="예: 비가 많이 왔어요"><label class="label">어떤 일이 있었나요?</label><textarea id="mstory" placeholder="예: 우산을 잠깐 같이 썼는데 계속 생각나요."></textarea><label class="label">정확한 단서 · 공개되지 않아요</label><textarea id="mprivate" placeholder="정확한 시간, 둘만 알 만한 기억 등"></textarea>${msg()}<button class="btn" onclick="createMemory()">비공개로 찾기 시작</button><button class="btn ghost" onclick="mode='main';render()">취소</button>`}
function mineView(){return `<div class="brand">내가 찾는 사람</div><div class="hero"><h1>남겨둔 기억</h1><p>처음엔 비공개, 필요할 때 관련자 전달과 숲 공개로 넓힐 수 있어요.</p></div>${msg()}${myFinds.length?myFinds.map(m=>`<div class="card"><span class="tag">${esc(m.reach_stage)}</span><div class="name" style="margin-top:12px">${esc(m.place_public)} · ${esc(m.time_public)}</div><p>${esc(m.story_public)}</p>${m.reach_stage==='private'?`<button class="btn secondary" onclick="expandFind('${m.id}','related')">관련된 사람들에게 닿게 하기</button>`:''}${m.reach_stage==='related'?`<button class="btn secondary" onclick="expandFind('${m.id}','forest')">못 찾으면 숲에 공개하기</button>`:''}<button class="btn ghost" onclick="loadCandidates('${m.id}')">내 이야기일지도 확인</button>${(candidates[m.id]||[]).map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="muted">${esc(c.school)} · ${esc(c.grade)}</div><button class="btn secondary" onclick="crush('${c.responder_user}')">이 사람을 마음에 담기</button></div>`).join('')}</div>`).join(''):'<div class="card muted">아직 남긴 기억이 없어요.</div>'}<button class="btn ghost" onclick="mode='main';render()">돌아가기</button>`}
function me(){return `<div class="brand">나</div><div class="hero"><h1>${esc(profile.name)}</h1><p>${esc(profile.school)} · ${esc(profile.grade)}</p></div><div class="card"><div class="row"><span>보낸 마음</span><b>${status?.outgoing_count??0}</b></div><div class="row" style="margin-top:14px"><span>받은 마음</span><b>${status?.incoming_count??0}</b></div><div class="row" style="margin-top:14px"><span>찾는 기억</span><b>${myFinds.length}</b></div></div><button class="btn secondary" onclick="refresh().then(render)">상태 새로고침</button><button class="btn ghost" onclick="logout()">로그아웃</button>`}
function go(t){tab=t;mode='main';notice='';results=[];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}function render(){if(!session){app.innerHTML=authView();return}if(!profile){app.innerHTML=profileView();return}nav.classList.remove('hide');app.innerHTML=tab==='home'?home():tab==='find'?find():me()}function devReset(){tab='home';mode='main';notice='';results=[];refresh().then(render)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));boot();
</script></body></html>
